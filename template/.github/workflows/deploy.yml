name: Build and deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  build-path: "dist"
  node-version: "24"

jobs:
  testBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          node-version: $\{{ env.node-version }}

      - name: Build
        run: {{packageManager}} run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          node-version: $\{{ env.node-version }}

      - name: Linting
        run: {{packageManager}} run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          node-version: $\{{ env.node-version }}

      - name: Test
        run: {{packageManager}} run test

  deploy:
    runs-on: ubuntu-latest
    needs: [testBuild, lint, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: "write"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          node-version: $\{{ env.node-version }}

      - name: Build
        run: {{packageManager}} run build

      - name: Push to Release
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: release
          FOLDER: $\{{ env.build-path }}
          GITHUB_TOKEN: $\{{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"
          SKIP_EMPTY_COMMITS: true
