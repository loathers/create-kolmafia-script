name: Lint, test and build
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn test

      - run: yarn build
